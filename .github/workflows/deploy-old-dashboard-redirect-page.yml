name: Deploy Dashboard Redirect
on:
  push:
    branches:
      - main
    paths:
      - archive/redirect-dashboard-bikespace-ca/index.html
jobs:
  deploy-to-cloudflare:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./archive/redirect-dashboard-bikespace-ca/ --project-name=dashboard-bikespace-redirect
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
