# One-command local dev stack: `make dev` (see README "Quick start (Docker)")
# Same project name as bikespace_api/docker/compose-dev.yaml, so `make dev` and
# `make dev-api` manage the same API and db containers.
name: bikespace_dev

include:
  - bikespace_api/docker/compose-dev.yaml # bikespace_api + db

services:
  bikespace_frontend:
    build:
      # tiny context: source and dependencies come from the volumes below
      context: bikespace_frontend/docker
      dockerfile: local.dockerfile
    ports:
      - "8080:8080"
    environment:
      # opt-in polling for Windows/WSL or file systems with unreliable change events
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-false}
    volumes:
      - ./bikespace_frontend:/app # source -> hot reload
      # keep these out of the host tree:
      - frontend_node_modules:/app/node_modules # Linux binaries, not the host's
      - frontend_next:/app/.next # lets a host `next dev` run at the same time
      - frontend_npm_cache:/home/node/.npm

volumes:
  frontend_node_modules:
  frontend_next:
  frontend_npm_cache:
