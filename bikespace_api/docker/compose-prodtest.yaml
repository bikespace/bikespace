# supplemental compose to use with compose-prod.yaml for local testing
name: bikespace_prod

services:
  bikespace_api:
    environment:
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}

  reverse_proxy:
    ports:
      - "${CADDY_HTTP_PORT:-8002}:80"

  backup:
    depends_on:
      s3:
        condition: service_healthy

  # Local S3 mock for the backup service (no auth configured, so any keys are accepted)
  s3:
    image: chrislusf/seaweedfs:${SEAWEEDFS_IMAGE_TAG:-4.53}
    command: server -dir=/data -s3 -s3.port=8333
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  s3_data:
