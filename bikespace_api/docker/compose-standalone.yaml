# supplemental compose to use with compose-prod.yaml for standalone deployment
name: bikespace_prod

services:
  bikespace_api:
    environment:
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}

  reverse_proxy:
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
